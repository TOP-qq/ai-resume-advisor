<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI职场智能推荐系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .page-wrapper {
            max-width: 860px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 0 30px;
            color: white;
        }

        .header .badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.25);
            border: 1px solid rgba(102, 126, 234, 0.5);
            color: #a5b4fc;
            font-size: 13px;
            padding: 5px 16px;
            border-radius: 20px;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(90deg, #a5b4fc, #e879f9, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 15px;
            color: rgba(255,255,255,0.55);
        }

        /* Card */
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 10px;
        }

        .form-group label .icon {
            font-size: 18px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            font-size: 14px;
            color: #e2e8f0;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #818cf8;
            background: rgba(129,140,248,0.1);
            box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
        }

        .form-group textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.7;
        }

        .char-hint {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 6px;
            text-align: right;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(99,102,241,0.4);
            letter-spacing: 0.5px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.6);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.6);
        }

        .loading.active { display: block; }

        .loading-bar {
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .loading-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; margin-left: 0; }
            50% { width: 70%; margin-left: 10%; }
            100% { width: 0%; margin-left: 100%; }
        }

        .loading-text {
            font-size: 14px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Result */
        .result {
            display: none;
        }

        .result.active {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .result-header h2 {
            font-size: 20px;
            color: #e2e8f0;
        }

        .check-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .result-block {
            margin-bottom: 18px;
        }

        .result-block-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .result-block-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, #6366f1, #8b5cf6);
            border-radius: 2px;
        }

        .result-company {
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 10px;
            padding: 16px 20px;
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
        }

        .result-advice {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 20px;
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            line-height: 1.9;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.6);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* Error */
        .error-box {
            display: none;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 14px 18px;
            color: #fca5a5;
            font-size: 14px;
            margin-top: 16px;
        }

        .error-box.active { display: block; animation: fadeUp 0.3s ease; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 0 10px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 26px; }
            .card { padding: 22px 18px; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">

    <!-- Header -->
    <div class="header">
        <div class="badge">✦ POWERED BY DEEPSEEK AI</div>
        <h1>AI 职场智能推荐系统</h1>
        <p>输入你的目标岗位和简历，AI 为你匹配最合适的公司，并给出定制化简历修改建议</p>
    </div>

    <!-- Input Form -->
    <div class="card" id="formCard">
        <div class="form-group">
            <label><span class="icon">🎯</span> 目标岗位</label>
            <input type="text" id="positionInput" placeholder="例如：算法工程师、前端开发、产品经理..." maxlength="100">
        </div>

        <div class="form-group">
            <label><span class="icon">📄</span> 你的简历</label>
            <textarea id="resumeInput" placeholder="请粘贴你的简历内容，包括：&#10;• 教育背景（学校、专业、学历）&#10;• 工作/实习经历（公司、岗位、时间、职责）&#10;• 项目经历（项目名称、技术栈、成果）&#10;• 技能特长（编程语言、工具、证书等）&#10;• 个人亮点"></textarea>
            <div class="char-hint" id="charCount">0 字</div>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="analyzeResume()">
            🔍 开始智能分析
        </button>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="loading-bar"><div class="loading-bar-inner"></div></div>
            <div class="loading-text" id="loadingText">AI 正在深度分析你的简历，请稍候...</div>
        </div>

        <!-- Error -->
        <div class="error-box" id="errorBox"></div>
    </div>

    <!-- Result -->
    <div class="card result" id="resultCard">
        <div class="result-header">
            <div class="check-icon">✓</div>
            <h2>分析结果</h2>
        </div>

        <div class="result-block">
            <div class="result-block-title">推荐公司</div>
            <div class="result-company" id="companyResult">—</div>
        </div>

        <div class="result-block">
            <div class="result-block-title">简历修改建议</div>
            <div class="result-advice" id="adviceResult">—</div>
        </div>

        <button class="reset-btn" onclick="resetForm()">↩ 重新分析</button>
    </div>

    <div class="footer">AI 生成内容仅供参考 · 基于 DeepSeek 大模型</div>
</div>

<script>
    // 字数统计
    const resumeInput = document.getElementById('resumeInput');
    const charCount = document.getElementById('charCount');
    resumeInput.addEventListener('input', () => {
        charCount.textContent = resumeInput.value.length + ' 字';
    });

    const loadingMessages = [
        'AI 正在深度分析你的简历，请稍候...',
        '正在匹配岗位与公司画像...',
        '正在生成个性化修改建议...',
        '即将完成，请稍等片刻...'
    ];

    let loadingTimer = null;

    function startLoadingAnimation() {
        let i = 0;
        const el = document.getElementById('loadingText');
        el.textContent = loadingMessages[0];
        loadingTimer = setInterval(() => {
            i = (i + 1) % loadingMessages.length;
            el.textContent = loadingMessages[i];
        }, 2500);
    }

    function stopLoadingAnimation() {
        if (loadingTimer) {
            clearInterval(loadingTimer);
            loadingTimer = null;
        }
    }

    async function analyzeResume() {
        const position = document.getElementById('positionInput').value.trim();
        const resume = document.getElementById('resumeInput').value.trim();
        const errorBox = document.getElementById('errorBox');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const resultCard = document.getElementById('resultCard');

        // 重置状态
        errorBox.classList.remove('active');
        resultCard.classList.remove('active');

        // 前端验证
        if (!position) {
            showError('请填写目标岗位');
            document.getElementById('positionInput').focus();
            return;
        }
        if (!resume) {
            showError('请填写简历内容');
            resumeInput.focus();
            return;
        }
        if (resume.length < 50) {
            showError('简历内容太短，请至少输入 50 个字符');
            resumeInput.focus();
            return;
        }

        // 开始加载
        submitBtn.disabled = true;
        loading.classList.add('active');
        startLoadingAnimation();

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ position, resume })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || '服务器返回错误，请稍后重试');
            }

            // 展示结果
            document.getElementById('companyResult').textContent = data.data.recommended_company;
            document.getElementById('adviceResult').textContent = data.data.modification_advice;
            resultCard.classList.add('active');

            // 滚动到结果
            setTimeout(() => {
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);

        } catch (err) {
            showError(err.message || '网络错误，请检查连接后重试');
        } finally {
            submitBtn.disabled = false;
            loading.classList.remove('active');
            stopLoadingAnimation();
        }
    }

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.textContent = '⚠ ' + msg;
        errorBox.classList.add('active');
    }

    function resetForm() {
        document.getElementById('resultCard').classList.remove('active');
        document.getElementById('errorBox').classList.remove('active');
        document.getElementById('positionInput').value = '';
        document.getElementById('resumeInput').value = '';
        charCount.textContent = '0 字';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 支持 Ctrl+Enter 提交
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            analyzeResume();
        }
    });
</script>
</body>
</html>
